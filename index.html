<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087fbe">
<meta name="description" content="Yaduwanshi Child Water - Version 9 Updated">
<link rel="manifest" href="manifest.json">
<title>यदुवंशी चिल्ड वाटर — Version 9</title>
<style>
:root{--blue:#087fbe;--dark:#063b69;--sky:#eaf7ff;--green:#16a66b;--orange:#f59e0b;--red:#dc3545;--purple:#7c3aed;--bg:#f4f7fb;--text:#172033;--muted:#64748b;--line:#e5eaf0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
.side{width:255px;background:linear-gradient(180deg,#063b69,#087fbe);color:#fff;padding:16px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:20}
.brand{text-align:center;padding:8px 5px 18px;border-bottom:1px solid #ffffff30}.brand .drop{font-size:40px}.brand b{display:block;font-size:19px}.brand small{opacity:.85}
.nav{margin-top:12px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#fff;padding:11px;border-radius:10px;margin:2px 0}.nav button.active,.nav button:hover{background:#ffffff22}
.main{margin-left:255px;width:calc(100% - 255px);padding:16px}.top{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:12px 15px;border-radius:14px;box-shadow:0 2px 10px #0000000b;position:sticky;top:8px;z-index:10}
.top h2{margin:0;font-size:18px}.hamb{display:none;border:0;background:#eef5fa;border-radius:8px;padding:8px;margin-right:8px}
.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.card,.box{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 10px #0000000b;margin-bottom:13px}.card{border-left:5px solid var(--blue)}.card.green{border-color:var(--green)}.card.orange{border-color:var(--orange)}.card.red{border-color:var(--red)}
.card .label{color:var(--muted);font-size:13px}.card b{font-size:23px;display:block;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d5dde7;border-radius:9px;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:0;border-radius:9px;padding:10px 13px}.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.warning{background:var(--orange);color:#fff}.danger{background:var(--red);color:#fff}.purple{background:var(--purple);color:#fff}.light{background:#eef5fa}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{background:#eef5fa;font-size:13px}
.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;background:#eef5fa}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.quick .btn{padding:13px}
.empty{text-align:center;color:var(--muted);padding:24px}.footer{text-align:center;color:var(--muted);padding:22px;font-size:12px}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:50}
.search{max-width:360px}.hidden{display:none!important}.clickable{cursor:pointer}.clickable:hover{background:#f7fbff}
.customer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.customer-name{font-size:18px;font-weight:700}.mini{font-size:12px;color:var(--muted)}
.monthbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.monthbar .field{min-width:160px}.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.mini-card{background:#f7fbff;border:1px solid #e5eef5;border-radius:10px;padding:10px}.mini-card span{font-size:12px;color:var(--muted)}.mini-card b{display:block;font-size:18px;margin-top:4px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tabs button{border:0;border-radius:8px;padding:8px 11px;background:#eef5fa}.tabs button.active{background:var(--blue);color:#fff}
.route-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.route-title{display:flex;justify-content:space-between;align-items:center}
.status-done{color:var(--green);font-weight:700}.status-pending{color:var(--red);font-weight:700}
.bill{border:2px solid var(--blue);padding:17px;border-radius:12px;background:#fff}.billhead{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #ddd;padding-bottom:12px}.statline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ddd}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:40}.modal.show{display:flex}.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:#fff;padding-bottom:10px;border-bottom:1px solid var(--line);z-index:2}
@media(max-width:900px){.side{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}.cards{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(3,1fr)}.summary-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin-left:0;width:100%;padding:9px}.hamb{display:inline-block}.top{top:4px}.cards,.grid,.formgrid{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.summary-grid{grid-template-columns:repeat(2,1fr)}.top h2{font-size:16px}.search{max-width:210px}}
@media print{.side,.top,.actions,.footer{display:none!important}.main{margin:0;width:100%;padding:0}.page{display:none}.page.active{display:block}.box{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="brand"><div class="drop">💧</div><b>यदुवंशी चिल्ड वाटर</b><small>RO WATER SUPPLY • VERSION 9</small></div>
  <div class="nav" id="nav"></div>
  <div style="margin-top:16px;background:#ffffff18;padding:11px;border-radius:10px;font-size:12px">📞 8516908957<br>📞 9039390971<br>📍 Bordehi, Teh. Amla, Dist. Betul</div>
</aside>
<main class="main">
  <div class="top"><div><button class="hamb" onclick="toggleSide()">☰</button><span id="pageTitle">Dashboard</span></div><div>📅 <span id="today"></span> &nbsp; <span class="pill">Admin</span></div></div>
  <section id="dashboard" class="page active"></section><section id="customers" class="page"></section><section id="delivery" class="page"></section>
  <section id="bills" class="page"></section><section id="payments" class="page"></section><section id="outstanding" class="page"></section>
  <section id="routes" class="page"></section><section id="staff" class="page"></section><section id="inventory" class="page"></section>
  <section id="reports" class="page"></section><section id="backup" class="page"></section><section id="settings" class="page"></section>
  <div class="footer">यदुवंशी चिल्ड वाटर • शुद्ध जल, स्वस्थ कल • Version 9 Updated</div>
</main></div>
<div class="toast" id="toast"></div>
<div class="modal" id="customerModal"><div class="modalbox"><div class="modalhead"><div><b id="modalTitle">Customer Record</b><div class="mini" id="modalSub"></div></div><button class="btn light" onclick="closeCustomer()">✕</button></div><div id="customerModalBody"></div></div></div>

<script>
const KEY='ycw_v9_updated';
const old=JSON.parse(localStorage.getItem('ycw_v9')||'null');
let S=JSON.parse(localStorage.getItem(KEY)||'null')||old||{
 customers:[],deliveries:[],payments:[],staff:[],routes:[],
 inventory:[{name:'20 Ltr Jar',stock:100},{name:'1 Ltr Bottle',stock:0},{name:'500 ml Bottle',stock:0},{name:'Caps',stock:0}],
 settings:{rate:25}
};
S.customers=S.customers||[];S.deliveries=S.deliveries||[];S.payments=S.payments||[];S.routes=S.routes||[];S.staff=S.staff||[];S.inventory=S.inventory||[];S.settings=S.settings||{rate:25};
function id(){return Date.now()+Math.random().toString(16).slice(2)}
function save(){localStorage.setItem(KEY,JSON.stringify(S));renderAll()}
function money(n){return '₹ '+Number(n||0).toLocaleString('en-IN')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function toggleSide(){document.getElementById('side').classList.toggle('open')}
const menus=[['dashboard','🏠 Dashboard'],['customers','👥 Customers'],['delivery','🚚 Daily Delivery'],['bills','🧾 Monthly Bill'],['payments','💰 Payments'],['outstanding','📌 Outstanding'],['routes','🗺️ Area / Route'],['staff','👤 Drivers / Staff'],['inventory','🫙 Jar Stock'],['reports','📊 Reports'],['backup','💾 Backup / Restore'],['settings','⚙️ Settings']];
document.getElementById('nav').innerHTML=menus.map(x=>`<button data-page="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('pageTitle').textContent=menus.find(x=>x[0]===p)[1].replace(/^\\S+ /,'');if(innerWidth<651)document.getElementById('side').classList.remove('open');renderPage(p)}
function balance(cid){let d=S.deliveries.filter(x=>x.cid===cid).reduce((a,x)=>a+x.amount,0);let p=S.payments.filter(x=>x.cid===cid).reduce((a,x)=>a+x.amount,0);return d-p}
function jarBalance(cid){let c=S.customers.find(x=>x.id===cid)||{};let delivered=S.deliveries.filter(x=>x.cid===cid).reduce((a,x)=>a+x.jars,0);let returned=S.deliveries.filter(x=>x.cid===cid).reduce((a,x)=>a+(x.returned||0),0);return Number(c.jar||0)+delivered-returned}
function customer(c){return S.customers.find(x=>x.id===c)||{}}
function monthOf(date){return String(date||'').slice(0,7)}
function monthLabel(m){let [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('hi-IN',{month:'long',year:'numeric'})}

function deliveryRows(arr,buttons=false){
 if(!arr.length)return '<div class="empty">कोई रिकॉर्ड नहीं</div>';
 return `<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Customer</th><th>Area</th><th>Jar</th><th>Return</th><th>Amount</th><th>Payment</th>${buttons?'<th>Action</th>':''}</tr>`+
 arr.map(d=>{let c=customer(d.cid);return `<tr><td>${d.date}</td><td class="clickable" onclick="openCustomer('${d.cid}')"><b>${esc(c.name)}</b></td><td>${esc(c.route)}</td><td>${d.jars}</td><td>${d.returned||0}</td><td>${money(d.amount)}</td><td>${esc(d.payment||'Pending')}</td>${buttons?`<td><button class="btn light" onclick="editDelivery('${d.id}')">✏️</button> <button class="btn danger" onclick="deleteDelivery('${d.id}')">×</button></td>`:''}</tr>`}).join('')+'</table></div>';
}

function renderDashboard(){
 let ds=S.deliveries.filter(x=>x.date===today()), jars=ds.reduce((a,x)=>a+x.jars,0), sales=ds.reduce((a,x)=>a+x.amount,0), paid=S.payments.filter(x=>x.date===today()).reduce((a,x)=>a+x.amount,0);
 let due=S.customers.reduce((a,c)=>a+balance(c.id),0);
 document.getElementById('dashboard').innerHTML=`<div class="cards">
 <div class="card"><span class="label">कुल ग्राहक</span><b>${S.customers.length}</b></div>
 <div class="card green"><span class="label">आज की डिलीवरी</span><b>${jars} जार</b></div>
 <div class="card orange"><span class="label">आज की बिक्री</span><b>${money(sales)}</b></div>
 <div class="card red"><span class="label">कुल बकाया</span><b>${money(due)}</b></div></div>
 <div class="box"><h3>⚡ Quick Actions</h3><div class="quick">
 <button class="btn primary" onclick="go('customers')">➕ ग्राहक जोड़ें</button><button class="btn success" onclick="go('delivery')">🚚 डेली डिलीवरी</button>
 <button class="btn warning" onclick="go('bills')">🧾 मंथली बिल</button><button class="btn primary" onclick="go('payments')">₹ पेमेंट</button><button class="btn light" onclick="go('reports')">📊 रिपोर्ट</button></div></div>
 <div class="grid"><div class="box"><h3>आज का सारांश</h3><div class="statline"><span>कुल जार</span><b>${jars}</b></div><div class="statline"><span>बिक्री</span><b>${money(sales)}</b></div><div class="statline"><span>आज प्राप्त</span><b>${money(paid)}</b></div><div class="statline"><span>बकाया</span><b>${money(due)}</b></div></div>
 <div class="box"><h3>🫙 Jar Stock</h3>${S.inventory.map(i=>`<div class="statline"><span>${esc(i.name)}</span><b>${i.stock}</b></div>`).join('')}</div></div>
 <div class="box"><h3>आज की एंट्री</h3>${deliveryRows(ds,true)}</div>`;
}

function customerForm(){
 return `<div class="box"><h3 id="custFormTitle">नया ग्राहक</h3><input type="hidden" id="editCid">
 <div class="formgrid"><div class="field"><label>ग्राहक नाम *</label><input id="cname"></div><div class="field"><label>मोबाइल</label><input id="cmobile" inputmode="numeric"></div>
 <div class="field"><label>पता</label><input id="caddress"></div><div class="field"><label>Area / Route</label><input id="croute" list="routesList"><datalist id="routesList">${S.routes.map(r=>`<option>${esc(r.name)}</option>`).join('')}</datalist></div>
 <div class="field"><label>Rate / Jar</label><input id="crate" type="number" value="${S.settings.rate}"></div><div class="field"><label>Opening Jar Balance</label><input id="cjar" type="number" value="0"></div></div>
 <div class="actions"><button class="btn primary" onclick="saveCustomer()">💾 Save Customer</button><button class="btn light" onclick="resetCustomer()">Reset</button></div></div>`;
}
function saveCustomer(){
 let name=document.getElementById('cname').value.trim();if(!name)return toast('नाम भरें');let cid=document.getElementById('editCid').value;
 let o={id:cid||id(),name,mobile:document.getElementById('cmobile').value,address:document.getElementById('caddress').value,route:document.getElementById('croute').value,rate:+document.getElementById('crate').value||S.settings.rate,jar:+document.getElementById('cjar').value||0};
 if(cid)Object.assign(S.customers.find(x=>x.id===cid),o);else S.customers.push(o);save();toast('Customer saved');
}
function resetCustomer(){['editCid','cname','cmobile','caddress','croute'].forEach(x=>document.getElementById(x).value='');document.getElementById('crate').value=S.settings.rate;document.getElementById('cjar').value=0;document.getElementById('custFormTitle').textContent='नया ग्राहक'}
function editCustomer(cid){let c=customer(cid);go('customers');setTimeout(()=>{document.getElementById('editCid').value=c.id;document.getElementById('cname').value=c.name;document.getElementById('cmobile').value=c.mobile||'';document.getElementById('caddress').value=c.address||'';document.getElementById('croute').value=c.route||'';document.getElementById('crate').value=c.rate;document.getElementById('cjar').value=c.jar||0;document.getElementById('custFormTitle').textContent='ग्राहक विवरण Edit करें'},20)}
function delCustomer(cid){if(confirm('ग्राहक हटाएं?')){S.customers=S.customers.filter(c=>c.id!==cid);save()}}
function renderCustomers(){
 let q=(document.getElementById('cq')?.value||'').toLowerCase();
 let rows=S.customers.filter(c=>(c.name+' '+c.mobile+' '+c.route+' '+c.address).toLowerCase().includes(q)).map(c=>`<tr class="clickable" onclick="openCustomer('${c.id}')"><td><b>${esc(c.name)}</b><div class="mini">${esc(c.address)}</div></td><td>${esc(c.mobile)}</td><td>${esc(c.route)}</td><td>${c.rate}</td><td>${jarBalance(c.id)}</td><td>${money(balance(c.id))}</td><td onclick="event.stopPropagation()"><button class="btn light" onclick="editCustomer('${c.id}')">✏️</button></td></tr>`).join('');
 document.getElementById('customers').innerHTML=customerForm()+`<div class="box"><div class="customer-head"><h3>👥 Customer List</h3><input class="search" id="cq" placeholder="नाम / मोबाइल / area search" value="${esc(q)}" oninput="renderCustomers()"></div>
 <div class="mini">Customer पर click करने से उसका पूरा date/month-wise record खुलेगा।</div><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Mobile</th><th>Area</th><th>Rate</th><th>Jar Balance</th><th>Pending ₹</th><th>Edit</th></tr>${rows||'<tr><td colspan="7" class="empty">अभी कोई ग्राहक नहीं</td></tr>'}</table></div></div>`;
}

function openCustomer(cid, month=today().slice(0,7)){
 let c=customer(cid);if(!c.id)return;
 document.getElementById('modalTitle').textContent=c.name;
 document.getElementById('modalSub').textContent=`${c.mobile||''} • ${c.route||'Area नहीं'} • Rate ${money(c.rate)}`;
 document.getElementById('customerModal').classList.add('show');
 renderCustomerModal(cid,month);
}
function closeCustomer(){document.getElementById('customerModal').classList.remove('show')}
function renderCustomerModal(cid,month){
 let c=customer(cid),ds=S.deliveries.filter(d=>d.cid===cid),ms=ds.filter(d=>monthOf(d.date)===month),ps=S.payments.filter(p=>p.cid===cid),mps=ps.filter(p=>monthOf(p.date)===month);
 let jars=ms.reduce((a,d)=>a+d.jars,0),ret=ms.reduce((a,d)=>a+(d.returned||0),0),bill=ms.reduce((a,d)=>a+d.amount,0),mpaid=mps.reduce((a,p)=>a+p.amount,0);
 let totalJ=ds.reduce((a,d)=>a+d.jars,0),totalBill=ds.reduce((a,d)=>a+d.amount,0),totalPaid=ps.reduce((a,p)=>a+p.amount,0);
 let daily=ms.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<tr><td>${d.date}</td><td>${d.jars}</td><td>${d.returned||0}</td><td>${money(d.amount)}</td><td>${esc(d.payment||'Pending')}</td></tr>`).join('');
 let pRows=mps.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td>${p.date}</td><td>${money(p.amount)}</td><td>${esc(p.mode)}</td></tr>`).join('');
 document.getElementById('customerModalBody').innerHTML=`<div class="monthbar">
 <div class="field"><label>Month</label><input type="month" value="${month}" onchange="renderCustomerModal('${cid}',this.value)"></div>
 <div class="actions"><button class="btn primary" onclick="go('delivery');closeCustomer()">🚚 Delivery</button><button class="btn success" onclick="quickPay('${cid}');closeCustomer()">₹ Payment</button><button class="btn warning" onclick="go('bills');closeCustomer()">🧾 Monthly Bill</button><button class="btn light" onclick="editCustomer('${cid}');closeCustomer()">✏️ Edit</button></div></div>
 <div class="summary-grid"><div class="mini-card"><span>${monthLabel(month)} Jar</span><b>${jars}</b></div><div class="mini-card"><span>Return</span><b>${ret}</b></div><div class="mini-card"><span>Bill</span><b>${money(bill)}</b></div><div class="mini-card"><span>Payment</span><b>${money(mpaid)}</b></div><div class="mini-card"><span>Pending</span><b>${money(balance(cid))}</b></div></div>
 <div class="box"><h3>📅 ${monthLabel(month)} — Daily Record</h3><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Jar</th><th>Return</th><th>Amount</th><th>Payment</th></tr>${daily||'<tr><td colspan="5" class="empty">इस महीने की delivery नहीं</td></tr>'}</table></div></div>
 <div class="box"><h3>💰 ${monthLabel(month)} — Payments</h3><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Amount</th><th>Mode</th></tr>${pRows||'<tr><td colspan="3" class="empty">इस महीने payment नहीं</td></tr>'}</table></div></div>
 <div class="box"><h3>📊 पूरा Customer Ledger</h3><div class="statline"><span>कुल delivered jars</span><b>${totalJ}</b></div><div class="statline"><span>कुल sales</span><b>${money(totalBill)}</b></div><div class="statline"><span>कुल payments</span><b>${money(totalPaid)}</b></div><div class="statline"><span>Current pending</span><b>${money(balance(cid))}</b></div><div class="statline"><span>Customer के पास अनुमानित jar</span><b>${jarBalance(cid)}</b></div></div>`;
}

function deliveryForm(){
 return `<div class="box"><h3>🚚 Daily Delivery Entry</h3><div class="formgrid">
 <div class="field"><label>Date</label><input type="date" id="ddate" value="${today()}"></div>
 <div class="field"><label>Customer Search</label><input id="dsearch" placeholder="नाम / मोबाइल / area" oninput="renderDeliveryCustomerOptions()"></div>
 <div class="field"><label>Customer</label><select id="dcid" onchange="syncDeliveryRate()"><option value="">Select customer</option></select></div>
 <div class="field"><label>Jar (+ / −)</label><div style="display:flex;gap:7px"><button class="btn light" onclick="changeJar(-1)">−</button><input type="number" id="djars" value="1" min="1" style="text-align:center"><button class="btn light" onclick="changeJar(1)">+</button></div></div>
 <div class="field"><label>Empty Jar Return</label><input type="number" id="dreturn" value="0" min="0"></div>
 <div class="field"><label>Payment Status</label><select id="dpay"><option>Pending</option><option>Cash</option><option>Online</option><option>UPI</option><option>Bank</option></select></div>
 <div class="field"><label>Rate / Jar</label><input id="drate" type="number" value="${S.settings.rate}"></div>
 <div class="field"><label>Amount</label><input id="damount" type="number" value="${S.settings.rate}" readonly></div></div>
 <div class="actions"><button class="btn success" onclick="addDelivery()">+ Delivery Save</button><button class="btn light" onclick="resetDeliveryForm()">Reset</button></div></div>`;
}
function renderDeliveryCustomerOptions(){

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

window.YCWCloud = (() => {
  let db=null, cloudId=localStorage.getItem('ycw_cloud_id')||'';
  let cfg=JSON.parse(localStorage.getItem('ycw_firebase_config')||'null');

  function status(t){const e=document.getElementById('cloudStatus');if(e)e.textContent=t;}
  function init(c){
    try{ const app=initializeApp(c); db=getFirestore(app); cfg=c; localStorage.setItem('ycw_firebase_config',JSON.stringify(c)); status('🟢 Firebase connected'); return true; }
    catch(e){status('🔴 Firebase config error'); alert('Firebase config check करें'); return false;}
  }
  async function push(){
    if(!db||!cloudId){alert('पहले Firebase setup और Cloud ID भरें');return}
    status('☁️ Uploading...');
    await setDoc(doc(db,'ycw_businesses',cloudId),{data:S,updatedAt:new Date().toISOString()},{merge:true});
    status('🟢 Cloud backup updated');
  }
  async function pull(){
    if(!db||!cloudId){alert('पहले Firebase setup और Cloud ID भरें');return}
    status('☁️ Downloading...');
    const snap=await getDoc(doc(db,'ycw_businesses',cloudId));
    if(snap.exists()&&snap.data().data){S=snap.data().data;save();status('🟢 Cloud data restored')}
    else status('🟡 Cloud record नहीं मिला');
  }
  window.cloudSetup=()=>{const c={apiKey:document.getElementById('fbApi').value.trim(),authDomain:document.getElementById('fbAuth').value.trim(),projectId:document.getElementById('fbProject').value.trim(),storageBucket:document.getElementById('fbStorage').value.trim(),messagingSenderId:document.getElementById('fbSender').value.trim(),appId:document.getElementById('fbApp').value.trim()}; if(!c.apiKey||!c.projectId||!c.appId){alert('Api Key, Project ID और App ID भरें');return} if(init(c)){localStorage.setItem('ycw_cloud_id',document.getElementById('cloudId').value.trim());}}
  window.cloudPush=push; window.cloudPull=pull;
  window.loadCloudConfig=()=>{if(cfg){for(const [id,key] of [['fbApi','apiKey'],['fbAuth','authDomain'],['fbProject','projectId'],['fbStorage','storageBucket'],['fbSender','messagingSenderId'],['fbApp','appId']]){const e=document.getElementById(id);if(e)e.value=cfg[key]||''}}const e=document.getElementById('cloudId');if(e)e.value=cloudId};
  return {init,push,pull};
})();
</script>
</body></html>
