<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087fbe"><meta name="description" content="Yaduwanshi Child Water - RO Water Business Management Version 9"><link rel="manifest" href="manifest.json"><title>यदुवंशी चिल्ड वाटर — Version 9</title><style>
:root{--blue:#087fbe;--dark:#073b66;--sky:#eaf7ff;--green:#19a974;--orange:#f59e0b;--red:#dc3545;--purple:#7c3aed;--bg:#f4f7fb;--text:#172033;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:255px;background:linear-gradient(180deg,#063b69,#087fbe);color:#fff;padding:16px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{padding:8px 5px 18px;text-align:center;border-bottom:1px solid #ffffff30}.brand .drop{font-size:42px}.brand b{display:block;font-size:20px}.brand small{opacity:.85}.nav{margin-top:14px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#fff;padding:12px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#ffffff22}.main{margin-left:255px;width:calc(100% - 255px);padding:18px}.top{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 2px 10px #0000000b;position:sticky;top:10px;z-index:5}.top h2{margin:0;font-size:19px}.hamb{display:none}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.card,.box{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0000000b}.card .label{color:var(--muted);font-size:13px}.card b{font-size:25px;display:block;margin-top:6px}.card.blue{border-left:5px solid var(--blue)}.card.green{border-left:5px solid var(--green)}.card.orange{border-left:5px solid var(--orange)}.card.red{border-left:5px solid var(--red)}h1,h2,h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d5dde7;border-radius:9px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:0;border-radius:9px;padding:10px 13px}.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:42px;height:42px;border:0;border-radius:10px;font-size:22px;font-weight:700}.stepper input{width:72px!important;text-align:center;font-weight:700}.paybox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.paybox button{padding:12px;border:2px solid #d5dde7;background:#fff;border-radius:10px;font-weight:700}.paybox button.active.cash{border-color:var(--green);background:#e9fff5;color:#087b52}.paybox button.active.pending{border-color:var(--orange);background:#fff7e8;color:#a15c00}.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.warning{background:var(--orange);color:#fff}.danger{background:var(--red);color:#fff}.light{background:#eef5fa}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:9px;border-bottom:1px solid #e8edf3;text-align:left;white-space:nowrap}.table th{background:#eef5fa;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;background:#eef5fa}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.quick .btn{padding:14px}.empty{text-align:center;color:var(--muted);padding:25px}.footer{text-align:center;color:var(--muted);padding:25px;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:20}.search{max-width:320px}.hidden{display:none!important}.bill{border:2px solid var(--blue);padding:18px;border-radius:12px;background:#fff}.billhead{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #ddd;padding-bottom:12px}.statline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ddd}@media(max-width:900px){.side{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}.cards{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.side{transform:translateX(-100%);transition:.2s;z-index:10}.side.open{transform:none}.main{margin-left:0;width:100%;padding:10px}.hamb{display:inline-block;border:0;background:#eef5fa;border-radius:8px;padding:8px;margin-right:8px}.top{top:5px}.cards,.grid,.formgrid{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.top h2{font-size:16px}.search{max-width:180px}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><div class="drop">💧</div><b>यदुवंशी चिल्ड वाटर</b><small>RO WATER SUPPLY • VERSION 9</small></div><div class="nav" id="nav"></div><div style="margin-top:18px;background:#ffffff18;padding:12px;border-radius:10px;font-size:12px">📞 8516908957<br>📞 9039390971<br>📍 Bordehi, Teh. Amla, Dist. Betul</div></aside><main class="main"><div class="top"><div><button class="hamb" onclick="toggleSide()">☰</button><span id="pageTitle">Dashboard</span></div><div>📅 <span id="today"></span> &nbsp; 🔔 <span class="pill">Admin</span></div></div><section id="dashboard" class="page active"></section><section id="customers" class="page"></section><section id="delivery" class="page"></section><section id="bills" class="page"></section><section id="payments" class="page"></section><section id="outstanding" class="page"></section><section id="routes" class="page"></section><section id="staff" class="page"></section><section id="inventory" class="page"></section><section id="reports" class="page"></section><section id="backup" class="page"></section><section id="settings" class="page"></section><div class="footer">यदुवंशी चिल्ड वाटर • शुद्ध जल, स्वस्थ कल • Version 9</div></main></div><div class="toast" id="toast"></div><script>
const KEY='ycw_v9';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{customers:[],deliveries:[],payments:[],staff:[],routes:[],inventory:[{name:'20 Ltr Jar',stock:100},{name:'1 Ltr Bottle',stock:0},{name:'500 ml Bottle',stock:0},{name:'Caps',stock:0}],settings:{rate:25}};function save(){localStorage.setItem(KEY,JSON.stringify(S));renderAll()}function id(){return Date.now()+Math.random().toString(16).slice(2)}function money(n){return '₹ '+Number(n||0).toLocaleString('en-IN')}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}function toggleSide(){document.getElementById('side').classList.toggle('open')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const menus=[['dashboard','🏠 Dashboard'],['customers','👥 Customers'],['delivery','🚚 Daily Delivery'],['bills','🧾 Monthly Bill'],['payments','💰 Payments'],['outstanding','📌 Outstanding'],['routes','🗺️ Area / Route'],['staff','👤 Drivers / Staff'],['inventory','🫙 Jar Stock'],['reports','📊 Reports'],['backup','💾 Backup / Restore'],['settings','⚙️ Settings']];document.getElementById('nav').innerHTML=menus.map(x=>`<button data-page="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('pageTitle').textContent=menus.find(x=>x[0]===p)[1].replace(/^\S+ /,'');if(innerWidth<651)document.getElementById('side').classList.remove('open');renderPage(p)}
function renderDashboard(){let today=new Date().toISOString().slice(0,10),ds=S.deliveries.filter(x=>x.date===today),col=ds.reduce((a,x)=>a+x.amount,0),paid=S.payments.filter(x=>x.date===today).reduce((a,x)=>a+x.amount,0),due=S.customers.reduce((a,c)=>a+balance(c.id),0),jars=ds.reduce((a,x)=>a+x.jars,0);document.getElementById('dashboard').innerHTML=`<div class="cards"><div class="card blue"><span class="label">कुल ग्राहक</span><b>${S.customers.length}</b></div><div class="card green"><span class="label">आज की डिलीवरी</span><b>${jars} जार</b></div><div class="card orange"><span class="label">आज की बिक्री</span><b>${money(col)}</b></div><div class="card red"><span class="label">कुल बकाया</span><b>${money(due)}</b></div></div><div class="box"><h3>⚡ Quick Actions</h3><div class="quick"><button class="btn primary" onclick="go('customers')">➕ ग्राहक जोड़ें</button><button class="btn success" onclick="go('delivery')">🚚 डेली डिलीवरी</button><button class="btn warning" onclick="go('bills')">🧾 मंथली बिल</button><button class="btn primary" onclick="go('payments')">₹ पेमेंट एंट्री</button><button class="btn light" onclick="go('reports')">📊 रिपोर्ट्स</button></div></div><div class="grid"><div class="box"><h3>आज का सारांश</h3><div class="statline"><span>डिलीवरी</span><b>${jars} जार</b></div><div class="statline"><span>बिक्री</span><b>${money(col)}</b></div><div class="statline"><span>आज प्राप्त</span><b>${money(paid)}</b></div><div class="statline"><span>कुल ग्राहक बकाया</span><b>${money(due)}</b></div></div><div class="box"><h3>🫙 Low Stock Alert</h3>${S.inventory.map(i=>`<div class="statline"><span>${esc(i.name)}</span><b>${i.stock}</b></div>`).join('')}</div></div><div class="box"><h3>हाल की डिलीवरी</h3>${deliveryTable(S.deliveries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`}
function balance(cid){let d=S.deliveries.filter(x=>x.cid===cid).reduce((a,x)=>a+x.amount,0),p=S.payments.filter(x=>x.cid===cid).reduce((a,x)=>a+x.amount,0);return d-p}
function customerForm(){return `<div class="box"><h3 id="custFormTitle">नया ग्राहक</h3><input type="hidden" id="editCid"><div class="formgrid"><div class="field"><label>ग्राहक नाम *</label><input id="cname"></div><div class="field"><label>मोबाइल</label><input id="cmobile" inputmode="numeric"></div><div class="field"><label>पता</label><input id="caddress"></div><div class="field"><label>Area / Route</label><input id="croute" list="routesList"><datalist id="routesList">${S.routes.map(r=>`<option>${esc(r.name)}</option>`).join('')}</datalist></div><div class="field"><label>Rate / Jar</label><input id="crate" type="number" value="${S.settings.rate}"></div><div class="field"><label>Opening Jar Balance</label><input id="cjar" type="number" value="0"></div></div><div class="actions"><button class="btn primary" onclick="saveCustomer()">💾 Save Customer</button><button class="btn light" onclick="resetCustomer()">Reset</button></div></div>`}
function saveCustomer(){let name=document.getElementById('cname').value.trim();if(!name)return toast('नाम भरें');let cid=document.getElementById('editCid').value;let o={id:cid||id(),name,mobile:document.getElementById('cmobile').value,address:document.getElementById('caddress').value,route:document.getElementById('croute').value,rate:+document.getElementById('crate').value||S.settings.rate,jar:+document.getElementById('cjar').value||0};if(cid){let c=S.customers.find(x=>x.id===cid);Object.assign(c,o)}else S.customers.push(o);save();toast('Customer saved')}
function resetCustomer(){['editCid','cname','cmobile','caddress','croute'].forEach(x=>document.getElementById(x).value='');document.getElementById('crate').value=S.settings.rate;document.getElementById('cjar').value=0;document.getElementById('custFormTitle').textContent='नया ग्राहक'}function editCustomer(cid){let c=S.customers.find(x=>x.id===cid);go('customers');setTimeout(()=>{document.getElementById('editCid').value=c.id;document.getElementById('cname').value=c.name;document.getElementById('cmobile').value=c.mobile||'';document.getElementById('caddress').value=c.address||'';document.getElementById('croute').value=c.route||'';document.getElementById('crate').value=c.rate;document.getElementById('cjar').value=c.jar||0;document.getElementById('custFormTitle').textContent='ग्राहक विवरण Edit करें'},20)}
function renderCustomers(){let q=(document.getElementById('cq')?.value||'').toLowerCase();let rows=S.customers.filter(c=>(c.name+' '+c.mobile+' '+c.route).toLowerCase().includes(q)).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.mobile)}</td><td>${esc(c.route)}</td><td>${c.rate}</td><td>${money(balance(c.id))}</td><td><button class="btn light" onclick="editCustomer('${c.id}')">✏️ Edit</button> <button class="btn danger" onclick="delCustomer('${c.id}')">Delete</button></td></tr>`).join('');document.getElementById('customers').innerHTML=customerForm()+`<div class="box"><div style="display:flex;justify-content:space-between;gap:10px"><h3>ग्राहक सूची</h3><input class="search" id="cq" placeholder="नाम / मोबाइल / route search" value="${esc(q)}" oninput="renderCustomers()"></div><div class="tablewrap"><table class="table"><tr><th>नाम</th><th>मोबाइल</th><th>Route</th><th>Rate</th><th>बकाया</th><th>Action</th></tr>${rows||'<tr><td colspan="6" class="empty">अभी कोई ग्राहक नहीं</td></tr>'}</table></div></div>`}function delCustomer(cid){if(confirm('ग्राहक हटाएं?')){S.customers=S.customers.filter(c=>c.id!==cid);save()}}
function deliveryTable(arr){if(!arr.length)return '<div class="empty">कोई रिकॉर्ड नहीं</div>';return `<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Customer</th><th>Area</th><th>Jars</th><th>Amount</th><th>Payment</th></tr>${arr.map(d=>{let c=S.customers.find(x=>x.id===d.cid)||{};return `<tr><td>${d.date}</td><td>${esc(c.name)}</td><td>${esc(c.route)}</td><td>${d.jars}</td><td>${money(d.amount)}</td><td>${esc(d.payment||'Pending')}</td></tr>`}).join('')}</table></div>`}
function setJar(v){let x=Math.max(1,Math.min(1000,+v||1));document.getElementById('djars').value=x;updateDeliveryAmount()}
function changeJar(n){setJar((+document.getElementById('djars').value||1)+n)}
function setPayStatus(v){document.getElementById('dpay').value=v;document.querySelectorAll('#paybox button').forEach(b=>b.classList.remove('active'));document.getElementById(v==='Cash'?'payCash':'payPending').classList.add('active',v==='Cash'?'cash':'pending');updateDeliveryAmount()}
function updateDeliveryAmount(){let cid=document.getElementById('dcid')?.value,j=+document.getElementById('djars')?.value||0,c=S.customers.find(x=>x.id===cid),a=j*(c?.rate||S.settings.rate);let el=document.getElementById('damount');if(el)el.textContent=money(a);let bal=document.getElementById('dbalance');if(bal&&cid)bal.textContent=money(balance(cid)+(document.getElementById('dpay')?.value==='Pending'?a:0))}
function renderDelivery(){document.getElementById('delivery').innerHTML=`<div class="box"><h3>🚚 Daily Delivery Entry</h3><div class="formgrid"><div class="field"><label>Date</label><input type="date" id="ddate" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Customer</label><select id="dcid" onchange="updateDeliveryAmount()"><option value="">Select customer</option>${S.customers.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.route)}</option>`).join('')}</select></div><div class="field"><label>Jars</label><div class="stepper"><button type="button" class="light" onclick="changeJar(-1)">−</button><input type="number" id="djars" value="1" min="1" max="1000" onchange="setJar(this.value)"><button type="button" class="light" onclick="changeJar(1)">+</button></div></div><div class="field"><label>Payment</label><div class="paybox" id="paybox"><button type="button" id="payCash" class="active cash" onclick="setPayStatus('Cash')">💵 Cash</button><button type="button" id="payPending" onclick="setPayStatus('Pending')">📌 Pending</button></div><select id="dpay" class="hidden"><option>Cash</option><option>Pending</option></select></div></div><div class="grid"><div class="box"><div class="statline"><span>Delivery Amount</span><b id="damount">₹ 0</b></div></div><div class="box"><div class="statline"><span>Customer Pending After Entry</span><b id="dbalance">₹ 0</b></div></div></div><div class="actions"><button class="btn success" onclick="addDelivery()">💾 Save Delivery</button></div></div><div class="box"><h3>Delivery History</h3>${deliveryTable(S.deliveries.slice().reverse().slice(0,100))}</div>`;updateDeliveryAmount()}
function addDelivery(){let cid=document.getElementById('dcid').value,j=+document.getElementById('djars').value||0;if(!cid||j<1)return toast('Customer और jars चुनें');let c=S.customers.find(x=>x.id===cid),amt=j*(c.rate||S.settings.rate),status=document.getElementById('dpay').value;S.deliveries.push({id:id(),cid,date:document.getElementById('ddate').value,jars:j,amount:amt,payment:status});if(status==='Cash')S.payments.push({id:id(),cid,date:document.getElementById('ddate').value,amount:amt,mode:'Cash',source:'delivery'});save();toast(status==='Cash'?'Delivery + Cash Payment saved':'Delivery + Pending saved')}

function renderBills(){let cid=S.customers[0]?.id||'';document.getElementById('bills').innerHTML=`<div class="box"><h3>🧾 Monthly Bill</h3><div class="formgrid"><div class="field"><label>Customer</label><select id="bcid" onchange="showBill()"><option value="">Select</option>${S.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Month</label><input type="month" id="bmonth" value="${new Date().toISOString().slice(0,7)}" onchange="showBill()"></div></div><div id="billout"></div></div>`;if(cid){document.getElementById('bcid').value=cid;showBill()}}function showBill(){let cid=document.getElementById('bcid').value,m=document.getElementById('bmonth').value;if(!cid)return;let c=S.customers.find(x=>x.id===cid),ds=S.deliveries.filter(d=>d.cid===cid&&d.date.startsWith(m)),total=ds.reduce((a,x)=>a+x.amount,0),pay=S.payments.filter(p=>p.cid===cid&&p.date.startsWith(m)).reduce((a,x)=>a+x.amount,0),opening=balance(cid)-total+pay;document.getElementById('billout').innerHTML=`<div class="bill"><div class="billhead"><div><h2>यदुवंशी चिल्ड वाटर</h2><div>RO Drinking Water • Bordehi, Betul (M.P.)</div><div>📞 8516908957 / 9039390971</div></div><b>MONTHLY BILL<br>${m}</b></div><p><b>Customer:</b> ${esc(c.name)} &nbsp; <b>Mobile:</b> ${esc(c.mobile)}</p><p><b>Area:</b> ${esc(c.route)} &nbsp; <b>Rate:</b> ${money(c.rate)}</p>${deliveryTable(ds)}<div class="statline"><span>Bill Amount</span><b>${money(total)}</b></div><div class="statline"><span>Payment This Month</span><b>${money(pay)}</b></div><div class="statline"><span>Current Outstanding</span><b>${money(balance(cid))}</b></div><div class="actions"><button class="btn primary" onclick="window.print()">🖨️ Print / Save PDF</button><button class="btn success" onclick="shareBill('${cid}','${m}')">WhatsApp</button></div></div>`}function shareBill(cid,m){let c=S.customers.find(x=>x.id===cid);let t=encodeURIComponent(`यदुवंशी चिल्ड वाटर\n${m} Monthly Bill\nCustomer: ${c.name}\nOutstanding: ${money(balance(cid))}`);window.open('https://wa.me/'+String(c.mobile||'').replace(/\D/g,'')+'?text='+t,'_blank')}
function changePayment(n){let x=Math.max(0,(+document.getElementById('pamt').value||0)+n);document.getElementById('pamt').value=x;updatePaymentPreview()}
function updatePaymentPreview(){let cid=document.getElementById('pcid')?.value,a=+document.getElementById('pamt')?.value||0,el=document.getElementById('pbal');if(el&&cid)el.textContent=money(Math.max(0,balance(cid)-a))}
function renderPayments(){document.getElementById('payments').innerHTML=`<div class="box"><h3>💰 Cash Payment Entry</h3><div class="formgrid"><div class="field"><label>Customer</label><select id="pcid" onchange="updatePaymentPreview()"><option value="">Select</option>${S.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" id="pdate" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Cash Amount</label><div class="stepper"><button type="button" class="light" onclick="changePayment(-10)">−</button><input type="number" id="pamt" min="0" onchange="updatePaymentPreview()"><button type="button" class="light" onclick="changePayment(10)">+</button></div></div><div class="field"><label>Mode</label><select id="pmode"><option>Cash</option><option>Online</option><option>UPI</option><option>Bank</option></select></div></div><div class="box"><div class="statline"><span>Pending after payment</span><b id="pbal">₹ 0</b></div></div><button class="btn success" onclick="addPayment()">💾 Save Cash Payment</button></div><div class="box"><h3>Payment History</h3>${S.payments.slice().reverse().map(p=>{let c=S.customers.find(x=>x.id===p.cid)||{};return `<div class="statline"><span>${p.date} • ${esc(c.name)} • ${p.mode}</span><b>${money(p.amount)}</b></div>`}).join('')||'<div class="empty">कोई payment नहीं</div>'}</div>`}
function addPayment(){let cid=document.getElementById('pcid').value,a=+document.getElementById('pamt').value||0;if(!cid||a<=0)return toast('Customer और amount भरें');S.payments.push({id:id(),cid,date:document.getElementById('pdate').value,amount:a,mode:document.getElementById('pmode').value,source:'manual'});save();toast('Cash Payment saved')}

function renderOutstanding(){let rows=S.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.mobile)}</td><td>${esc(c.route)}</td><td>${money(balance(c.id))}</td><td><button class="btn success" onclick="quickPay('${c.id}')">₹ Payment</button></td></tr>`).join('');document.getElementById('outstanding').innerHTML=`<div class="box"><h3>📌 Outstanding / बकाया</h3><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Mobile</th><th>Route</th><th>Outstanding</th><th>Action</th></tr>${rows||'<tr><td colspan="5" class="empty">कोई ग्राहक नहीं</td></tr>'}</table></div></div>`}function quickPay(cid){go('payments');setTimeout(()=>document.getElementById('pcid').value=cid,30)}
function renderRoutes(){document.getElementById('routes').innerHTML=`<div class="box"><h3>🗺️ Area / Route</h3><div class="actions"><input id="rname" placeholder="जैसे Bordehi / Navegaon"><button class="btn primary" onclick="addRoute()">+ Add Area</button></div>${S.routes.map(r=>`<div class="statline"><span>${esc(r.name)}</span><b>${S.customers.filter(c=>c.route===r.name).length} ग्राहक</b></div>`).join('')||'<div class="empty">Area add करें</div>'}</div>`}function addRoute(){let n=document.getElementById('rname').value.trim();if(n){S.routes.push({id:id(),name:n});save();toast('Area added')}}
function renderStaff(){document.getElementById('staff').innerHTML=`<div class="box"><h3>👤 Drivers / Staff</h3><div class="formgrid"><div class="field"><label>Name</label><input id="sname"></div><div class="field"><label>Mobile</label><input id="smobile"></div><div class="field"><label>Role</label><select id="srole"><option>Driver</option><option>Staff</option><option>Manager</option></select></div></div><button class="btn primary" onclick="addStaff()">+ Add Staff</button></div><div class="box">${S.staff.map(s=>`<div class="statline"><span>👤 ${esc(s.name)} • ${esc(s.mobile)}</span><b>${s.role}</b></div>`).join('')||'<div class="empty">Staff नहीं है</div>'}</div>`}function addStaff(){let n=document.getElementById('sname').value.trim();if(n){S.staff.push({id:id(),name:n,mobile:document.getElementById('smobile').value,role:document.getElementById('srole').value});save();toast('Staff added')}}
function renderInventory(){document.getElementById('inventory').innerHTML=`<div class="box"><h3>🫙 Jar / Stock Management</h3>${S.inventory.map((i,k)=>`<div class="statline"><span>${esc(i.name)}</span><span><input type="number" value="${i.stock}" style="width:90px" onchange="S.inventory[${k}].stock=+this.value||0;save()"></span></div>`).join('')}<div class="actions"><input id="iname" placeholder="New item"><button class="btn primary" onclick="addInv()">+ Add Item</button></div></div>`}function addInv(){let n=document.getElementById('iname').value.trim();if(n){S.inventory.push({name:n,stock:0});save()}}
function renderReports(){let byMonth={};S.deliveries.forEach(d=>{let m=d.date.slice(0,7);byMonth[m]=(byMonth[m]||0)+d.amount});document.getElementById('reports').innerHTML=`<div class="cards"><div class="card blue"><span class="label">Total Sales</span><b>${money(S.deliveries.reduce((a,d)=>a+d.amount,0))}</b></div><div class="card green"><span class="label">Total Payments</span><b>${money(S.payments.reduce((a,p)=>a+p.amount,0))}</b></div><div class="card orange"><span class="label">Total Jars</span><b>${S.deliveries.reduce((a,d)=>a+d.jars,0)}</b></div><div class="card red"><span class="label">Outstanding</span><b>${money(S.customers.reduce((a,c)=>a+balance(c.id),0))}</b></div></div><div class="box"><h3>Monthly Sales</h3>${Object.entries(byMonth).sort().reverse().map(([m,a])=>`<div class="statline"><span>${m}</span><b>${money(a)}</b></div>`).join('')||'<div class="empty">No data</div>'}</div>`}
function backup(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='yaduwanshi-child-water-backup.json';a.click()}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();toast('Backup restored')}catch{toast('Invalid backup')}};r.readAsText(f)}function renderBackup(){document.getElementById('backup').innerHTML=`<div class="box"><h3>💾 Backup / Restore</h3><p>फोन बदलने या data सुरक्षित रखने के लिए backup डाउनलोड करें।</p><div class="actions"><button class="btn primary" onclick="backup()">⬇️ Download Backup</button><label class="btn light">⬆️ Restore Backup <input type="file" accept="application/json" hidden onchange="restore(event)"></label></div></div>`}function renderSettings(){document.getElementById('settings').innerHTML=`<div class="box"><h3>⚙️ Business Settings</h3><div class="formgrid"><div class="field"><label>Default Jar Rate (₹)</label><input id="sr" type="number" value="${S.settings.rate}"></div><div class="field"><label>Business Name</label><input value="यदुवंशी चिल्ड वाटर" disabled></div><div class="field"><label>Phone</label><input value="8516908957" disabled></div><div class="field"><label>Address</label><input value="Bordehi, Teh. Amla, Dist. Betul" disabled></div></div><button class="btn primary" onclick="S.settings.rate=+document.getElementById('sr').value||25;save();toast('Settings saved')">Save Settings</button><hr><button class="btn danger" onclick="if(confirm('सारा local data delete करें?')){localStorage.removeItem(KEY);location.reload()}">Delete All Local Data</button></div>`}
function renderPage(p){({dashboard:renderDashboard,customers:renderCustomers,delivery:renderDelivery,bills:renderBills,payments:renderPayments,outstanding:renderOutstanding,routes:renderRoutes,staff:renderStaff,inventory:renderInventory,reports:renderReports,backup:renderBackup,settings:renderSettings})[p]()}function renderAll(){menus.forEach(x=>renderPage(x[0]))}document.getElementById('today').textContent=new Date().toLocaleDateString('hi-IN',{day:'2-digit',month:'short',year:'numeric'});renderAll();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
